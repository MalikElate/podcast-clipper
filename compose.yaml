services:
  bridge:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set the Clerk publishable key}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      BRIDGE_LOCAL_PREVIEW: "0"
      BRIDGE_SERVE_FRONTEND: "true"
      BRIDGE_DATA_DIR: /data
    volumes:
      - bridge-data:/data
    ports:
      - "127.0.0.1:8787:8787"
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
volumes:
  bridge-data:
