      <g transform="translate(-5 -70)"><use href="#cream-flower"/></g>
      <g transform="translate(38 -54) scale(.9)"><use href="#orange-flower"/></g>
    </g>
    <g id="sprout">
      <path d="M0 8C1-10 1-22-2-36" stroke="#78906a" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M0-7C10-20 22-20 29-17C24-6 14-2 0-3Z" fill="url(#blade-light)"/>
      <path d="M-1-17C-9-29-21-31-27-27C-21-17-12-12-1-13Z" fill="url(#blade)"/>
    </g>
  </defs>
  <g opacity=".68">
