<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <style>
      .stem { stroke: #78906f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .vein { stroke: #8fa486; stroke-width: 1.15; stroke-linecap: round; }
      .petal { fill: #fffdf4; stroke: #b7c5ad; stroke-width: 1.2; }
      .petal-warm { fill: #e9a66d; stroke: #c77b45; stroke-width: 1.1; }
      .leaf { fill: #b8c9ad; stroke: #78906f; stroke-width: 1.1; }
      .leaf-light { fill: #d4dfca; stroke: #92a58a; stroke-width: 1; }
