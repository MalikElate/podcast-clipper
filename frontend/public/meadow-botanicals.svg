<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#738d62"/>
      <stop offset="1" stop-color="#b8cba3"/>
    </linearGradient>
    <linearGradient id="blade-light" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#9bb28b"/>
      <stop offset="1" stop-color="#d5e0c8"/>
    </linearGradient>
    <radialGradient id="cream-petal">
      <stop stop-color="#fffdf0"/>
      <stop offset="1" stop-color="#e8e7cf"/>
    </radialGradient>
    <filter id="ground-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <g id="cream-flower">
      <ellipse cx="0" cy="-6" rx="3.8" ry="6" fill="url(#cream-petal)"/>
      <ellipse cx="5.7" cy="-1.9" rx="3.8" ry="6" transform="rotate(72 5.7 -1.9)" fill="url(#cream-petal)"/>
      <ellipse cx="3.5" cy="4.8" rx="3.8" ry="6" transform="rotate(144 3.5 4.8)" fill="url(#cream-petal)"/>
      <ellipse cx="-3.5" cy="4.8" rx="3.8" ry="6" transform="rotate(216 -3.5 4.8)" fill="url(#cream-petal)"/>
      <ellipse cx="-5.7" cy="-1.9" rx="3.8" ry="6" transform="rotate(288 -5.7 -1.9)" fill="url(#cream-petal)"/>
      <circle r="2.7" fill="#cf8148"/>
    </g>
    <g id="orange-flower">
      <ellipse cx="0" cy="-6" rx="3.6" ry="6" fill="#e59a61"/>
      <ellipse cx="5.7" cy="-1.9" rx="3.6" ry="6" transform="rotate(72 5.7 -1.9)" fill="#e59a61"/>
      <ellipse cx="3.5" cy="4.8" rx="3.6" ry="6" transform="rotate(144 3.5 4.8)" fill="#e59a61"/>
      <ellipse cx="-3.5" cy="4.8" rx="3.6" ry="6" transform="rotate(216 -3.5 4.8)" fill="#e59a61"/>
      <ellipse cx="-5.7" cy="-1.9" rx="3.6" ry="6" transform="rotate(288 -5.7 -1.9)" fill="#e59a61"/>
      <circle r="2.5" fill="#fff2c4"/>
    </g>
    <g id="soft-tuft">
      <ellipse cx="0" cy="2" rx="33" ry="8" fill="#617a53" opacity=".15" filter="url(#ground-shadow)"/>
      <path d="M-4 3C-24-23-24-47-18-70C-3-49 2-25-4 3Z" fill="url(#blade-light)"/>
      <path d="M-1 4C-10-34-2-67 13-91C18-55 12-22-1 4Z" fill="url(#blade)"/>
      <path d="M2 4C12-26 29-48 48-60C43-33 27-9 2 4Z" fill="url(#blade-light)"/>
      <path d="M-5 4C-28-13-45-34-50-53C-27-43-10-23-5 4Z" fill="url(#blade)"/>
      <path d="M1 5C19-11 38-20 56-20C43-2 24 7 1 5Z" fill="url(#blade)" opacity=".78"/>
    </g>
    <g id="flower-tuft">
      <use href="#soft-tuft"/>
      <g stroke="#718863" stroke-width="1.7" stroke-linecap="round">
        <path d="M4 0C5-24 3-46-4-68"/>
        <path d="M9 1C17-20 25-38 37-52"/>
