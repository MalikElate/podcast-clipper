    </linearGradient>
    <linearGradient id="blade-light" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#9bb28b"/>
      <stop offset="1" stop-color="#d5e0c8"/>
    </linearGradient>
    <radialGradient id="cream-petal">
