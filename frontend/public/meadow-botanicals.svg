      <path d="M-4 4C-10-20-10-47-4-70C1-45 1-18-4 4Z" fill="url(#blade-light)"/>
      <path d="M-1 4C-4-32 3-66 13-91C15-55 10-20-1 4Z" fill="url(#blade)"/>
