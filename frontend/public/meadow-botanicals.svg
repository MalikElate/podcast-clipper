      <ellipse class="petal" cx="5.3" cy="7.3" rx="5" ry="9" transform="rotate(144 5.3 7.3)"/>
      <ellipse class="petal" cx="-5.3" cy="7.3" rx="5" ry="9" transform="rotate(216 -5.3 7.3)"/>
